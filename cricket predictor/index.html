<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crick algorithm </title>
        <link rel="stylesheet" href="styles.css">
        </head>
        <body>
            <div class="container">
                <h1>Cricket Match Predictor</h1>
                <p> Enter the player details for best prediction</p>
                <label for="teamSize">Select Team Size</label>
                <select id="teamSize">
                    <option value="6">6vs6</option>
                    <option value="11">11vs11</option>
                </select>
                <div id="playerInputs"></div>
                <button id="addPlayer">+ Add player</button>
                <button id="generateTeams">Generate 20 teams</button>
            </div>
            <script src="script.js"></script>
        </body>
        </html>
